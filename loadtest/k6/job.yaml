# One k6 run. run-k6-job.sh fills in __TARGET__ and creates the k6-scenario ConfigMap.
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-run
  namespace: loadtest
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k6
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 12345
        runAsGroup: 12345
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: k6
          image: grafana/k6:2.3.0@sha256:9c2dee7f8ed74d317e4027c06a10f169b625638189de8d4555d0b3486a5aeb34
          args: ["run", "--quiet", "--no-color", "/scripts/scenario.js"]
          env:
            - name: TARGET
              value: "__TARGET__"
            - name: WORK_ITERATIONS
              value: "__WORK_ITERATIONS__"
            - name: STEP_DURATION
              value: "__STEP_DURATION__"
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: scripts
          configMap:
            name: k6-scenario
        - name: tmp
          emptyDir: {}

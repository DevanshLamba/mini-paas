name: CI

on:
  push:
    branches: [main]
    # Only app and CI changes produce a new image. Docs and manifest-only commits
    # (including the image-tag bumps GitOps makes in Phase 4) don't trigger a rebuild.
    paths:
      - "app/**"
      - "ci/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "ci/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

# Least privilege by default: no job gets any token scope unless it asks for it below.
permissions: {}

# A newer push to the same branch or PR makes older in-flight runs obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # ghcr.io requires lowercase names; github.repository is "DevanshLamba/mini-paas".
  IMAGE: ghcr.io/devanshlamba/mini-paas
  PYTHON_VERSION: "3.13"

defaults:
  run:
    shell: bash
    working-directory: app

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Install only ruff, at the exact version pinned in requirements-dev.txt.
      - run: pip install "$(grep '^ruff==' requirements-dev.txt)"
      - run: ruff check --output-format=github .
      - run: ruff format --check .

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -W error --cov-report=xml --cov-report=html --junitxml=junit.xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: |
            app/coverage.xml
            app/htmlcov/
            app/junit.xml
          retention-days: 14
          if-no-files-found: error

  build-scan-push:
    name: Build, scan, push (amd64 + arm64)
    needs: [lint, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write         # push to ghcr.io (only used on main)
      security-events: write  # upload Trivy SARIF to the Security tab
    env:
      PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      PLATFORMS: linux/amd64,linux/arm64
      # Throwaway registry that lives only for this job. The multi-arch image is built once
      # into it, every architecture is scanned and smoke-tested from it, and only then are
      # the identical bytes copied to ghcr.io.
      STAGING: localhost:5000/sampleapi
      TRIVY_INSECURE: "true"  # the staging registry is plain HTTP on localhost
    services:
      registry:
        image: registry:3.1.2@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8
        ports:
          - 5000:5000
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute short SHA
        id: vars
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # QEMU lets the amd64 runner build and run arm64 images (Oracle Ampere A1 is arm64).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host  # so BuildKit can reach the staging registry

      - name: Build multi-arch image into staging registry
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # Keep the build summary but skip the extra .dockerbuild artifact on every run.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: app
          platforms: ${{ env.PLATFORMS }}
          push: true
          build-args: APP_VERSION=${{ steps.vars.outputs.sha }}
          tags: ${{ env.STAGING }}:${{ steps.vars.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0  # pinned; bump deliberately

      # Scan 1: full reports per architecture for the Security tab. Never fails the build.
      - name: Trivy scan (SARIF reports)
        env:
          SHA: ${{ steps.vars.outputs.sha }}
        run: |
          for platform in ${PLATFORMS//,/ }; do
            trivy image --quiet --platform "$platform" --format sarif \
              --output "$GITHUB_WORKSPACE/trivy-${platform#linux/}.sarif" "$STAGING:$SHA"
          done

      - name: Upload SARIF (amd64)
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-amd64.sarif
          category: trivy-image  # same category as before, so existing alerts keep their history

      - name: Upload SARIF (arm64)
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-arm64.sarif
          category: trivy-image-arm64

      # Scan 2: the gate, for every architecture. Fail on HIGH/CRITICAL vulnerabilities that
      # have a fix available (unfixed ones can't be acted on, so they're reported, not blocking).
      - name: Trivy gate (fixable HIGH/CRITICAL)
        env:
          SHA: ${{ steps.vars.outputs.sha }}
        run: |
          for platform in ${PLATFORMS//,/ }; do
            echo "::group::Trivy gate ${platform}"
            trivy image --quiet --platform "$platform" --severity HIGH,CRITICAL \
              --ignore-unfixed --exit-code 1 "$STAGING:$SHA"
            echo "::endgroup::"
          done

      # Every architecture must actually start and answer before anything is published.
      - name: Smoke test each architecture
        env:
          SHA: ${{ steps.vars.outputs.sha }}
        run: |
          for platform in ${PLATFORMS//,/ }; do
            cid=$(docker run -d --platform "$platform" -p 127.0.0.1::8000 "$STAGING:$SHA")
            port=$(docker port "$cid" 8000/tcp | head -1 | sed 's/.*://')
            ok=""
            for _ in $(seq 1 60); do
              if curl -sf "http://127.0.0.1:${port}/ready" >/dev/null; then ok=1; break; fi
              sleep 1
            done
            arch=$(docker exec "$cid" python -c 'import platform; print(platform.machine())')
            version=$(curl -sf "http://127.0.0.1:${port}/version" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
            docker rm -f "$cid" >/dev/null
            echo "${platform}: ready=${ok:-no} arch=${arch} version=${version}"
            [ -n "$ok" ] && [ "$version" = "$SHA" ] || { echo "::error::smoke test failed for ${platform}"; exit 1; }
            echo "| ${platform} | ${arch} | ${version} | ✅ |" >> "$RUNNER_TEMP/smoke.md"
          done

      - name: Log in to ghcr.io
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Copy the scanned, smoke-tested index to ghcr.io unchanged (same digest).
      - name: Publish to ghcr.io
        if: env.PUSH == 'true'
        env:
          SHA: ${{ steps.vars.outputs.sha }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:$SHA" --tag "$IMAGE:latest" "$STAGING:$SHA"
          docker buildx imagetools inspect "$IMAGE:$SHA"

      - name: Job summary
        if: always()
        env:
          SHA: ${{ steps.vars.outputs.sha }}
        run: |
          {
            echo "### Image \`$IMAGE:$SHA\` (pushed: $PUSH)"
            echo "| Platform | Arch reported | Version | Smoke test |"
            echo "|---|---|---|---|"
            cat "$RUNNER_TEMP/smoke.md" 2>/dev/null || echo "| - | - | - | not run |"
            echo
            echo '```'
            docker buildx imagetools inspect "$STAGING:$SHA" 2>/dev/null | grep -E "^(Name|Digest)|Platform" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # GitOps hand-off: record the new image in git; Argo CD notices and deploys it.
  # CI never talks to the cluster, so it holds no cluster credentials.
  update-manifests:
    name: Update dev manifest
    needs: build-scan-push
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write  # the only job allowed to push to the repo
    # Serialise manifest commits so two runs never race on the same file.
    concurrency:
      group: update-manifests-dev
      cancel-in-progress: false
    env:
      SHA: ${{ needs.build-scan-push.outputs.sha }}
      FILE: deploy/overlays/dev/kustomization.yaml
    defaults:
      run:
        working-directory: .
    steps:
      # Credentials must persist: this job's purpose is to push one commit, and it runs no
      # third-party code after checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # zizmor: ignore[artipacked]

      - name: Set image tag
        run: |
          sed -i -E "s/^(\s*newTag:\s*).*/\1${SHA}/" "$FILE"
          grep -qE "^\s*newTag: ${SHA}$" "$FILE" || { echo "::error::tag not updated"; exit 1; }
          kubectl kustomize deploy/overlays/dev | grep -F "image: ${IMAGE}:${SHA}"

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "Manifest already at ${SHA}; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy(dev): sampleapi ${SHA}" \
            -m "Image ${IMAGE}:${SHA} built by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # Someone may have pushed meanwhile: rebase onto it and retry (never force).
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            echo "Push rejected (attempt ${attempt}); rebasing onto origin/main"
            git pull --rebase origin main
          done
          exit 1

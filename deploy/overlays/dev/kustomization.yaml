apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sampleapi-dev

resources:
  - namespace.yaml
  - ../../base

labels:
  - pairs:
      app.kubernetes.io/environment: dev
    includeSelectors: false
    includeTemplates: true

# Image from the local k3d registry. scripts/deploy.ps1 rewrites newTag on each deploy.
images:
  - name: sampleapi
    newName: minipaas-registry.localhost:5050/sampleapi
    newTag: ce87432

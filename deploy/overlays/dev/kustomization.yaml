apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sampleapi-dev

resources:
  - namespace.yaml
  - ../../base

labels:
  - pairs:
      app.kubernetes.io/environment: dev
    includeSelectors: false
    includeTemplates: true

# GitOps-managed: Argo CD deploys whatever this says. CI's update-manifests job
# rewrites newTag to the commit SHA of every image it publishes; don't edit by hand.
images:
  - name: sampleapi
    newName: ghcr.io/devanshlamba/mini-paas
    newTag: 98e1566

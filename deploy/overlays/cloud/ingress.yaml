# Host-less rule: answers on the VM's public IP and on whatever *.trycloudflare.com name
# the quick tunnel gets, without needing to know that name in advance.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sampleapi
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sampleapi
                port:
                  name: http
